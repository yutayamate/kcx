name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          test "$(uname -m)" = "$ARCH"
          swiftc -O -framework Security Sources/kcx/main.swift -o "dist/kcx-macos-$ARCH"
          file "dist/kcx-macos-$ARCH"

      - name: Test
        env:
          ARCH: ${{ matrix.arch }}
        run: sh Tests/integration.sh "dist/kcx-macos-$ARCH"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release binary
        env:
          BINARY: dist/kcx-macos-${{ matrix.arch }}
        run: cosign sign-blob "$BINARY" --bundle "$BINARY.sigstore.json" --yes

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ./dist/kcx-macos-${{ matrix.arch }}
          format: spdx-json
          output-file: ./dist/kcx-macos-${{ matrix.arch }}.spdx.json
          artifact-name: kcx-macos-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # GitHub artifact attestations require public visibility or GitHub Enterprise Cloud.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/kcx-macos-${{ matrix.arch }}

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/kcx-macos-${{ matrix.arch }}
          sbom-path: dist/kcx-macos-${{ matrix.arch }}.spdx.json

      - name: Upload release files
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: kcx-${{ matrix.arch }}
          path: dist/kcx-macos-${{ matrix.arch }}*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release files
        uses: actions/download-artifact@e455989ae00f5bdd4054f05d3e972c6bf8a62dc5 # v8.0.2
        with:
          pattern: kcx-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: cd dist && shasum -a 256 kcx-macos-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/kcx-macos-* dist/SHA256SUMS --title "kcx $TAG" --generate-notes
