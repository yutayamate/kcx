name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist
          swiftc -O -framework Security Sources/kcx/main.swift -o dist/kcx
          shasum -a 256 dist/kcx > dist/SHA256SUMS

      - name: Test
        run: sh Tests/integration.sh dist/kcx

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcx-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/kcx
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
